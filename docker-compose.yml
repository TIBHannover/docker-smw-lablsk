x-variables:
  - &environment_mysql_root_password MYSQL_ROOT_PASSWORD=database
  - &volume_wiki_images wiki-images:/var/www/html/images
  - &volume_eln_uploads eln-uploads:/app/uploads

services:

  # Note that BackstopJS testing will only work for the default values
  # WIKI_DOMAIN=wiki.local and WIKI_PORT=80

  wiki:
    image: ghcr.io/tibhannover/smw-lablsk:test
    build: ./context
    ports:
      - ${WIKI_PORT:-80}:80
    volumes:
      - wiki-data:/data
      - *volume_wiki_images
      - ./backstop/backstop_data:/var/www/html/backstop
      # ELN adapter: the extension stores uploads in the directory reported by the service, so both share it
      - *volume_eln_uploads
      - ./eln/LocalSettings.Runtime.php:/var/www/html/LocalSettings.LabLSK/LocalSettings.Runtime.php:ro
      - ./eln/job-proxy.conf:/etc/apache2/conf-enabled/eln-job-proxy.conf:ro
    environment:
      - WIKI_DOMAIN=${WIKI_DOMAIN:-wiki.local}
      - WIKI_PORT=${WIKI_PORT:-80}
      - ELASTICSEARCH_HOST=elasticsearch
      - MYSQL_HOST
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eln-init:
        condition: service_completed_successfully
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.run-jobs.schedule: "@every 15s"
      ofelia.job-exec.run-jobs.command: "run-jobs.sh --quiet"
      ofelia.job-exec.run-jobs.no-overlap: "true"

  ofelia:
    image: mcuadros/ofelia:0.4.0-beta
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/config.ini
      - ./ofelia/reports:/reports

  memcached:
    image: memcached:latest

  # The wiki (www-data) has to write into the upload directory, which the service image creates for its own user
  eln-init:
    image: ghcr.io/tibhannover/eln-smw-adapter:${ELN_SMW_ADAPTER_VERSION:-1.0.0}
    user: root
    command: ["chmod", "0777", "/app/uploads"]
    volumes:
      - *volume_eln_uploads

  # Needs the bot ElnBot@adapter in the wiki, see `make eln-sandbox`.
  # The credentials are sandbox values for the local test wiki only; MediaWiki requires bot passwords
  # of at least 32 characters from [0-9a-w]. Never put real credentials into this file.
  eln-smw-adapter:
    image: ghcr.io/tibhannover/eln-smw-adapter:${ELN_SMW_ADAPTER_VERSION:-1.0.0}
    volumes:
      - eln-log:/app/log
      - eln-jobs:/app/jobs
      - *volume_eln_uploads
    environment:
      - SMW_API_URL=http://wiki/api.php
      - SMW_USERNAME=${ELN_SMW_USERNAME:-ElnBot@adapter}
      - SMW_PASSWORD=${ELN_SMW_PASSWORD:-0123456789abcdef0123456789abcdef}
      - UPLOAD_PATH=/app/uploads
      - ENABLED_PLUGINS=Excel-local
      - EXCEL_LOCAL_TYPE=upload
      # gunicorn does not log requests by default
      - GUNICORN_CMD_ARGS=--access-logfile -
    # Starts after the wiki, but the wiki must not wait for the service to be healthy:
    # the service healthcheck needs a successful login to the wiki
    depends_on:
      - wiki

  elasticsearch:
    ## MW recommends to use their own images and sticking with the version even if a newer ES is available
    ## https://gitlab.wikimedia.org/repos/search-platform/cirrussearch-elasticsearch-image
    ## https://docker-registry.wikimedia.org/repos/search-platform/cirrussearch-elasticsearch-image/tags/
    image: docker-registry.wikimedia.org/repos/search-platform/cirrussearch-elasticsearch-image:v7.10.2-12
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: curl -s http://elasticsearch:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 50

  mysql:
    image: mysql:8
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: database
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 5s
      timeout: 5s
      retries: 42

  backup:
    image: ghcr.io/gesinn-it-pub/mediawiki-backup:${MEDIAWIKI_BACKUP_VERSION:-latest}
    volumes:
      - ./backup:/backup
      - *volume_wiki_images
    environment:
      - MYSQL_HOST=mysql
      - *environment_mysql_root_password
      - OWNER=${OWNER:-1000}
    profiles:
      - no-up

  backstop:
    image: backstopjs/backstopjs:6.0.4
    volumes:
      - ./backstop:/src
    links:
      - wiki:wiki.local
    profiles:
      - no-up

  wait-for-wiki:
    image: mintel/docker-wait-for-it
    entrypoint: ['/opt/wait-for-it.sh', 'wiki:80', '-t', '120']
    profiles:
      - no-up

volumes:
  wiki-data:
  wiki-images:
  elasticsearch-data:
  mysql-data:
  eln-uploads:
  eln-log:
  eln-jobs:
