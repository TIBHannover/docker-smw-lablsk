# The browser polls the job status of the adapter service under the wiki's own host
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
ProxyPass /eln-smw-adapter/job/ http://eln-smw-adapter:5000/job/
ProxyPassReverse /eln-smw-adapter/job/ http://eln-smw-adapter:5000/job/
